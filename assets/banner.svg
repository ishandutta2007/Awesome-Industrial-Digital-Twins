<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="320">
  <defs>
    <!-- Dark Tech Gradient Background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>

    <radialGradient id="centerHighlight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#374151" stroke-width="0.5" stroke-opacity="0.3"/>
      <circle cx="40" cy="40" r="1" fill="#06b6d4" fill-opacity="0.4"/>
    </pattern>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulsePulse {
      0% { opacity: 0.3; }
      50% { opacity: 0.8; }
      100% { opacity: 0.3; }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -40; }
    }
    .animated-wire { stroke-dasharray: 8 4; animation: dashMove 3s linear infinite; }
    .glowing-node { animation: pulsePulse 4s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bgGradient)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect width="1200" height="320" fill="url(#centerHighlight)"/>

  <!-- Background Dynamic Mesh & Digital Twin Nodes -->
  <g opacity="0.4">
    <!-- Physical to Digital Sync Lines -->
    <path d="M 100 240 Q 300 280 500 220 T 900 250 T 1100 200" fill="none" stroke="#06b6d4" stroke-width="2" class="animated-wire"/>
    <path d="M 80 80 Q 400 30 700 90 T 1120 70" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4 4"/>

    <!-- Decorative Digital Twin Nodes -->
    <circle cx="150" cy="220" r="6" fill="#06b6d4" filter="url(#glow)"/>
    <circle cx="350" cy="250" r="4" fill="#3b82f6"/>
    <circle cx="950" cy="230" r="5" fill="#ec4899" filter="url(#glow)"/>
    <circle cx="1050" cy="90" r="7" fill="#10b981" filter="url(#glow)"/>

    <!-- Geometric Wireframe Elements -->
    <polygon points="60,60 110,30 160,60 160,110 110,140 60,110" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
    <polygon points="1040,180 1090,150 1140,180 1140,230 1090,260 1040,230" fill="none" stroke="#06b6d4" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Foreground Title and Subtitle Box -->
  <g text-anchor="middle" transform="translate(600, 160)">
    <!-- Decorative Category Pill Header -->
    <g transform="translate(0, -95)">
      <rect x="-140" y="-16" width="280" height="32" rx="16" fill="#1f2937" stroke="url(#cyanGlow)" stroke-width="1.5"/>
      <text fill="#06b6d4" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="2" y="5">INDUSTRY 4.0 ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text y="-20" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" filter="url(#textGlow)">Awesome Industrial Digital Twins</text>

    <!-- Subtitle -->
    <text y="28" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="400" letter-spacing="0.5">Curated Industrial Digital Twin Platforms, Asset Modeling &amp; Real-Time Simulation</text>

    <!-- Feature Tags Row -->
    <g transform="translate(0, 72)">
      <text fill="#6b7280" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">
        <tspan fill="#38bdf8">Asset Modeling</tspan> &#8226; 
        <tspan fill="#a78bfa">Real-Time Sync</tspan> &#8226; 
        <tspan fill="#34d399">Open-Source Frameworks</tspan> &#8226; 
        <tspan fill="#f472b6">Predictive Analytics</tspan>
      </text>
    </g>
  </g>
</svg>
